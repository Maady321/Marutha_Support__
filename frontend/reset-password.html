<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Ashwasa</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="/" class="nav-brand">
      <div class="brand-logo">A</div>
      <span class="brand-name">Ashwasa</span>
    </a>
  </nav>

  <!-- Auth Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <h2 id="card-title">Choose New Password</h2>
      <p class="auth-subtitle" id="card-subtitle">
        Please enter and confirm your new password below.
      </p>

      <!-- Alerts -->
      <div id="error-alert" class="alert alert-danger hidden"></div>
      <div id="success-alert" class="alert alert-success hidden"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="form-input" required>
          <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.3rem;">Must be at least 8 characters, with 1 uppercase, 1 lowercase, and 1 number.</p>
        </div>

        <button type="submit" class="btn-accent w-full" id="submit-btn" style="margin-top: 1.5rem;">Save Password</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 Ashwasa Healthcare. All rights reserved.
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    requireGuest();

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      form.classList.add('hidden');
      document.getElementById('card-title').innerText = 'Invalid Reset Link';
      errorAlert.innerText = 'No password reset token was found in the link. Please request a new recovery link.';
      errorAlert.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Updating...';

      const newPassword = document.getElementById('password').value;

      try {
        await fetchApi('/api/v1/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });
        
        // Success
        form.classList.add('hidden');
        document.getElementById('card-title').innerText = 'Password Reset Completed!';
        document.getElementById('card-subtitle').innerText = 'Your password has been successfully modified.';
        
        successAlert.innerHTML = `
          Success! You can now log in using your new credentials.
          <br><br>
          <a href="/login" class="btn-accent" style="margin-top:1rem; width:100%; display:flex;">Sign In</a>
        `;
        successAlert.classList.remove('hidden');
      } catch (err) {
        errorAlert.innerText = err.message || 'Reset failed. Token may be invalid or expired.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save Password';
      }
    });
  </script>
</body>
</html>
