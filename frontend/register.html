<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Ashwasa</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="/" class="nav-brand">
      <div class="brand-logo">A</div>
      <span class="brand-name">Ashwasa</span>
    </a>
  </nav>

  <!-- Auth Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <h2 id="card-title">Create your account</h2>
      <p class="auth-subtitle" id="card-subtitle">
        Already have an account? <a href="/login">Sign in</a>
      </p>

      <!-- Alerts -->
      <div id="error-alert" class="alert alert-danger hidden"></div>
      <div id="success-alert" class="alert alert-success hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" class="form-input" placeholder="John" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" required>
          <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.3rem;">Must be at least 8 characters, with 1 uppercase, 1 lowercase, and 1 number.</p>
        </div>

        <div class="form-group">
          <label for="role">I am registering as a</label>
          <select id="role" class="form-input" required>
            <option value="PATIENT">Patient</option>
            <option value="FAMILY_MEMBER">Family Member</option>
            <option value="DOCTOR">Doctor</option>
            <option value="VOLUNTEER">Volunteer</option>
          </select>
        </div>

        <button type="submit" class="btn-accent w-full" id="submit-btn" style="margin-top:1rem;">Register</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 Ashwasa Healthcare. All rights reserved.
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    requireGuest();

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating account...';

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        await fetchApi('/api/v1/auth/register', {
          method: 'POST',
          body: JSON.stringify({ firstName, lastName, email, password, role })
        });
        
        // Success
        form.classList.add('hidden');
        document.getElementById('card-title').innerText = 'Registration Successful!';
        document.getElementById('card-subtitle').innerText = 'Check your console for the mock verification link.';
        
        successAlert.innerHTML = `
          Registration complete. 
          <br><br>
          We've sent a verification link to your email. Since this is local, 
          <strong>please copy the mock link printed in your server console</strong> 
          and paste it in your browser to verify your email.
          <br><br>
          <a href="/login" class="btn-primary" style="margin-top:1rem; width:100%; display:flex;">Go to Login</a>
        `;
        successAlert.classList.remove('hidden');
      } catch (err) {
        errorAlert.innerText = err.message || 'Registration failed.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register';
      }
    });
  </script>
</body>
</html>
