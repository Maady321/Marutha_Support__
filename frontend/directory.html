<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Directory - Ashwasa</title>
  <link rel="stylesheet" href="/static/css/index.css" />
  <style>
    .directory-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .directory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
    }
    .toggle-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .toggle-btn {
      padding: 0.5rem 1.5rem;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .card h3 {
      margin: 0;
      font-size: 1.25rem;
    }
    .card p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      background: #eef2ff;
      color: var(--accent-color);
      margin-top: 0.5rem;
      width: fit-content;
    }
  </style>
</head>
<body>
  
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">Ashwasa</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/directory" style="font-weight: 600;">Directory</a>
        <a href="/login" id="nav-login">Log In</a>
        <a href="/register" class="btn-accent" id="nav-register">Sign Up</a>
        <a href="/dashboard" class="hidden" id="nav-dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="directory-container">
    <div class="directory-header">
      <h2>Ashwasa Directory</h2>
      <p class="text-secondary">Find verified doctors and palliative care units.</p>
    </div>

    <div class="toggle-group">
      <button class="toggle-btn active" id="btn-doctors" onclick="switchTab('doctors')">Doctors</button>
      <button class="toggle-btn" id="btn-hospitals" onclick="switchTab('hospitals')">Hospitals</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search by specialty, name, or location...">
      <button class="btn-primary" onclick="performSearch()">Search</button>
    </div>

    <div class="grid" id="directory-grid">
      <!-- Cards rendered here via JS -->
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/directory.js"></script>
</body>
</html>
