<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Ashwasa</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="/" class="nav-brand">
      <div class="brand-logo">A</div>
      <span class="brand-name">Ashwasa</span>
    </a>
  </nav>

  <!-- Auth Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <h2 id="card-title">Reset Password</h2>
      <p class="auth-subtitle" id="card-subtitle">
        Enter your email address and we'll send you a recovery link.
      </p>

      <!-- Alerts -->
      <div id="error-alert" class="alert alert-danger hidden"></div>
      <div id="success-alert" class="alert alert-success hidden"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn-accent w-full" id="submit-btn" style="margin-top: 1rem;">Send Recovery Link</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 Ashwasa Healthcare. All rights reserved.
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    requireGuest();

    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';

      const email = document.getElementById('email').value.trim();

      try {
        await fetchApi('/api/v1/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        
        // Success
        form.classList.add('hidden');
        document.getElementById('card-title').innerText = 'Link Dispatched!';
        document.getElementById('card-subtitle').innerText = 'Check your console for the recovery link.';
        
        successAlert.innerHTML = `
          If the email exists, a password reset link has been sent.
          <br><br>
          Since this is local, 
          <strong>please check the mock link printed in your server console</strong> 
          to reset your password.
          <br><br>
          <a href="/login" class="btn-primary" style="margin-top:1rem; width:100%; display:flex;">Go to Login</a>
        `;
        successAlert.classList.remove('hidden');
      } catch (err) {
        errorAlert.innerText = err.message || 'An error occurred. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Recovery Link';
      }
    });
  </script>
</body>
</html>
