name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Check Formatting
        run: pnpm prettier --check "**/*.{ts,tsx,md,json,yaml}"
        
      - name: Lint
        run: pnpm lint
        
      - name: Type Check
        run: pnpm typecheck
        
      - name: Build
        run: pnpm build
        
      - name: Run Tests
        run: pnpm test
